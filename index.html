<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顧客一覧（合成デモ）</title>
</head>
<body>
<h1>顧客一覧</h1>
<p>合成デモです。実際の顧客情報は含みません。</p>
<form id="customer-filter">
  <label>顧客名 <input name="q" placeholder="顧客名で絞り込み"></label>
  <button type="submit">条件を保存</button>
</form>
<p id="saved" hidden>検索条件を保存しました。</p>
<table>
  <thead><tr><th>顧客名</th><th>状況</th></tr></thead>
  <tbody><tr><td>デモ商店</td><td>対応中</td></tr><tr><td>サンプル工房</td><td>確認待ち</td></tr></tbody>
</table>
<script>
document.getElementById('customer-filter').addEventListener('submit', e => {
  e.preventDefault();
  document.getElementById('saved').hidden = false;
});
</script>
</body>
</html>
